<!DOCTYPE html>
<html>
<head>
    <title>Multimedia Player</title>
</head>
<body>

    <h1 align="center">
        <font color="blue">Multimedia Player</font>
    </h1>

    <table width="100%" bgcolor="pink">
        <tr>
            <td><h2>Audio Section</h2></td>
        </tr>
    </table>

    <audio controls>
        <source src="https://raw.githubusercontent.com/mdn/learning-area/main/html/multimedia-and-embedding/tasks/audio-video/audio.mp3" type="audio/mpeg">
        Your browser does not support audio.
    </audio>

    <br><br>

    <table width="100%" bgcolor="pink">
        <tr>
            <td><h2>Video Section</h2></td>
        </tr>
    </table>

    <video width="320" height="180" controls>
        <source src="https://mdn.github.io/learning-area/html/multimedia-and-embedding/video-and-audio-content/rabbit320.mp4" type="video/mp4">
        Your browser does not support video.
    </video>

</body>
</html>
